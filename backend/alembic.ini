[alembic]
# Path to migration scripts
script_location = alembic
prepend_sys_path = .

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps (leave blank for system local time)
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Do not autogenerate revision files with no changes detected
revision_environment = false

# Version path separator
version_path_separator = os

# The actual DB URL is NOT hardcoded here - it is injected at runtime
# in alembic/env.py from app.core.config.settings, so local/staging/prod
# all use the same .env-driven configuration as the FastAPI app.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
